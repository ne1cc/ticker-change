services:
  - type: web
    name: ticker-change
    runtime: python
    buildCommand: pip install -r requirements.txt
    # --timeout 120: /api/institutional's cold path (100-permutation null
    # test) can exceed gunicorn's 30s default on a shared-vCPU instance.
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      # --- Market-positioning data providers ---
      # Set these in the Render dashboard (sync: false = value is NOT read from
      # this file; Render stores it securely on its side).
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      # Contact string per SEC EDGAR fair-access policy. Set the real value in
      # the Render dashboard -- do NOT commit a personal email here.
      - key: SEC_USER_AGENT
        sync: false

      # --- AI analyst report providers (any one is enough; tried in order) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # --- S3 option-chain cache (values set in the Render dashboard) ---
      - key: S3_CACHE_BUCKET
        sync: false
      - key: S3_CACHE_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # --- Runtime ---
      - key: PYTHON_VERSION
        value: 3.12.0

      # Shared secret for POST /api/warm-cache (EOD options cache warm,
      # called by the scheduled GitHub Action). Set the same value in the
      # repo's WARM_CACHE_TOKEN Actions secret.
      - key: WARM_CACHE_TOKEN
        sync: false
