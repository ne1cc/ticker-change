name: Options Cache Warm and Sync

on:
  schedule:
    # Hourly on weekdays through US market hours (14:15-21:15 UTC = 9:15 AM-5:15 PM ET).
    - cron: '15 14-21 * * 1-5'
    # Separate entry, not just another hour, so the closing run is identifiable
    # via github.event.schedule and can additionally force-refresh the Fly cache.
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

jobs:
  warm-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance boto3 pandas

      - name: Run S3 Cache Warmer
        run: python warm_s3_cache.py
        env:
          S3_CACHE_BUCKET: ${{ secrets.S3_CACHE_BUCKET }}
          S3_CACHE_PREFIX: ${{ secrets.S3_CACHE_PREFIX }}
          S3_CACHE_REGION: ${{ secrets.S3_CACHE_REGION }}
          S3_CACHE_ENDPOINT_URL: ${{ secrets.S3_CACHE_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_URL: https://ticker-change.fly.dev
          WARM_CACHE_TOKEN: ${{ secrets.WARM_CACHE_TOKEN }}

      # Runs even when the S3 step above failed: the Fly SQLite cache is an
      # independent store, and keeping it correct is what makes the chain show
      # real OI/volume after the close regardless of S3's state.
      - name: Force EOD refresh of the Fly options cache
        if: ${{ !cancelled() && (github.event.schedule == '15 22 * * 1-5' || github.event_name == 'workflow_dispatch') }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.WARM_CACHE_TOKEN }}" \
            https://ticker-change.fly.dev/api/warm-cache
